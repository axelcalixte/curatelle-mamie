<button
  class="btn btn-xs btn-ghost"
  [attr.popovertarget]="`popover-${name()}`"
  [attr.style]="`anchor-name:--anchor-${name()}`"
>
  <svg class="size-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
    <!--!Font Awesome Free 7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
    <path
      d="M297.4 438.6C309.9 451.1 330.2 451.1 342.7 438.6L502.7 278.6C515.2 266.1 515.2 245.8 502.7 233.3C490.2 220.8 469.9 220.8 457.4 233.3L320 370.7L182.6 233.4C170.1 220.9 149.8 220.9 137.3 233.4C124.8 245.9 124.8 266.2 137.3 278.7L297.3 438.7z"
    />
  </svg>
</button>

<div
  class="dropdown menu rounded-box bg-base-100 flex w-52 flex-col gap-1 shadow-sm"
  popover
  [attr.id]="`popover-${name()}`"
  [attr.style]="`position-anchor:--anchor-${name()}`"
>
  <div id="search">
    <input
      [attr.name]="name()"
      type="text"
      [attr.placeholder]="name()"
      class="input"
      (change)="onChange($event)"
    />
  </div>
  @if (anyChecked()) {
    <div>
      <ul>
        @for (v of isChecked()?.values(); track v.value) {
          <li class="bg-primary-content dark:bg-accent">
            <a (click)="toggleChecked(v.value)">{{ v.label }} {{ v.value }} {{ v.checked }}</a>
          </li>
        }
      </ul>
    </div>
    <div>
      <hr class="border" />
    </div>
  }
  <div>
    <ul>
      @for (v of isNotChecked()?.values(); track v.value) {
        <li>
          <a (click)="toggleChecked(v.value)">{{ v.label }} {{ v.value }} {{ v.checked }}</a>
        </li>
      }
    </ul>
  </div>
  <div class="flex flex-row place-content-between">
    <button class="btn" (click)="toggleAllChecked()">RESET</button>
    <button class="btn">APPLY</button>
  </div>
</div>
